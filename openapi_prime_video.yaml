  /media/{mediaId}/adaptive-summary:
    parameters:
    - name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - AdaptiveSummaries
      summary: Générer un résumé adaptatif par IA
      operationId: getAdaptiveSummary
      description: 'Service d''IA générant un récapitulatif textuel ou vidéo des saisons précédentes basé sur les épisodes
        réellement vus par le profil, évitant tout spoil. Retourne 202 Accepted si la génération est asynchrone.

        '
      parameters:
      - name: profile_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: Profil pour personnaliser le résumé
      - name: format
        in: query
        schema:
          type: string
          enum:
          - text
          - video
          - audio
          default: text
        description: Format du résumé
      - name: season_number
        in: query
        schema:
          type: integer
          minimum: 1
        description: Numéro de saison à résumer (par défaut la dernière vue)
      - name: max_length_sec
        in: query
        schema:
          type: integer
          default: 120
        description: Durée max du résumé vidéo/audio en secondes
      responses:
        '200':
          description: Résumé adaptatif généré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdaptiveSummary'
        '202':
          description: Résumé en cours de génération (traitement asynchrone)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: processing
                  estimated_completion_sec:
                    type: integer
                    example: 30
                  poll_url:
                    type: string
                    example: /v1/media/{mediaId}/adaptive-summary/status/abc123
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
