  /users/{userId}/pin:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    put:
      tags:
      - Users
      summary: Configurer ou modifier le code PIN
      operationId: updatePin
      description: 'Configure le PIN parental ou d''achat (PUT idempotent). Le PIN verrouille l''accès aux contenus adultes
        et aux achats.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pin
              - scope
              properties:
                pin:
                  type: string
                  minLength: 4
                  maxLength: 4
                  pattern: ^\d{4}$
                scope:
                  type: array
                  items:
                    type: string
                    enum:
                    - purchases
                    - adult_content
                    - all
      responses:
        '200':
          description: PIN configuré
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Users
      summary: Désactiver le code PIN
      operationId: removePin
      description: Supprime le PIN (DELETE idempotent).
      responses:
        '204':
          description: PIN désactivé
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
