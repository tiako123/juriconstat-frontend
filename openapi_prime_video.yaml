                    type: string
                    format: uuid
                  estimated_recipients:
                    type: integer
                  status:
                    type: string
                    example: sending
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/genres:
    get:
      tags:
      - Admin
      summary: Lister les genres du catalogue
      operationId: getGenres
      description: Retourne tous les genres/catégories disponibles.
      responses:
        '200':
          description: Liste des genres
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=86400
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Genre'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Admin
      summary: Créer un nouveau genre
      operationId: createGenre
      description: Ajoute une catégorie au catalogue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenreCreate'
      responses:
        '201':
          description: Genre créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
        '409':
          description: Genre déjà existant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/genres/{genreId}:
    parameters:
    - name: genreId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      tags:
      - Admin
      summary: Modifier un genre
      operationId: updateGenre
      description: Mise à jour complète (PUT idempotent).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenreCreate'
      responses:
        '200':
          description: Genre mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Admin
      summary: Supprimer un genre
      operationId: deleteGenre
      description: Supprime un genre (DELETE idempotent).
      responses:
        '204':
          description: Genre supprimé
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Genre utilisé par des contenus existants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/reports:
    get:
      tags:
      - Admin
      summary: Générer un rapport d'utilisation
      operationId: getReport
      description: 'Génère un rapport exportable (JSON ou CSV). Retourne 202 si la génération est asynchrone pour les rapports
        volumineux.

        '
      parameters:
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - users
          - subscriptions
          - content_performance
          - revenue
          - engagement
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - csv
          default: json
      - name: from_date
        in: query
        schema:
          type: string
          format: date
      - name: to_date
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Rapport généré (petit volume)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
            text/csv:
              schema:
                type: string
        '202':
          description: Rapport en cours de génération (gros volume, asynchrone)
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: generating
                  download_url:
                    type: string
                    format: uri
                    description: URL de téléchargement (disponible une fois généré)
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Authentification JWT (RFC 7519) stateless. Le token contient header (algorithme HS512), payload (sub,
        roles, iat, exp) et signature. Transmis via header Authorization: Bearer <token>.

        '
    OAuth2:
      type: oauth2
      description: OAuth 2.0 Authorization Code Flow pour applications tierces.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.primevideo.amazon.com/oauth/authorize
          tokenUrl: https://auth.primevideo.amazon.com/oauth/token
          refreshUrl: https://auth.primevideo.amazon.com/oauth/refresh
          scopes:
            read: Lecture des ressources
            write: Création et modification des ressources
            admin: Accès administrateur complet
            stream: Accès au streaming vidéo
            download: Accès au téléchargement hors-ligne
  parameters:
    PageParam:
      name: page
      in: query
      description: Numéro de page (pagination offset)
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      description: Nombre d'éléments par page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortParam:
      name: sort
      in: query
      description: 'Champ et direction de tri (ex: created_at_desc, title_asc, rating_desc)

        '
      schema:
        type: string
        example: created_at_desc
  responses:
    NotFound:
      description: La ressource demandée n'a pas été trouvée (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.primevideo.amazon.com/errors/not-found
            title: Ressource non trouvée
            status: 404
            detail: La ressource demandée n'existe pas
            timestamp: '2026-01-15T10:30:00Z'
            correlationId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    Unauthorized:
      description: Authentification requise - Token JWT manquant ou invalide (401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.primevideo.amazon.com/errors/unauthorized
            title: Authentification requise
            status: 401
            detail: Token d'authentification manquant ou invalide
    Forbidden:
      description: Accès refusé - authentifié mais non autorisé (403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.primevideo.amazon.com/errors/forbidden
            title: Accès refusé
            status: 403
            detail: Vous n'avez pas les permissions nécessaires
    ValidationError:
      description: Erreur de validation des données (400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    TooManyRequests:
      description: Trop de requêtes - rate limiting (429)
      headers:
        Retry-After:
          schema:
            type: integer
          description: Secondes avant de réessayer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Erreur serveur interne inattendue (500)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.primevideo.amazon.com/errors/internal
            title: Erreur interne du serveur
            status: 500
            detail: Une erreur inattendue est survenue
            correlationId: xyz-789-correlation-id
  schemas:
    AuthRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          description: Adresse email de l'utilisateur
          example: user@example.com
        password:
          type: string
          minLength: 8
          description: Mot de passe (min 8 chars, 1 majuscule, 1 chiffre)
          example: SecurePass123!
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Token JWT (header.payload.signature encodé Base64)
          example: eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJ1c2VyQGV4YW1wbGUuY29tIn0.abc123
        refresh_token:
          type: string
          description: Token de rafraîchissement longue durée
        token_type:
          type: string
          enum:
          - Bearer
          example: Bearer
        expires_in:
          type: integer
          description: Durée de validité en secondes
          example: 3600
        scope:
          type: string
          example: read write stream
    User:
      type: object
      required:
      - id
      - email
      - username
      properties:
        id:
          type: integer
          format: int64
          description: Identifiant unique
          example: 12345
        email:
          type: string
          format: email
          example: user@example.com
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: ^[a-zA-Z0-9_]+$
          example: john_doe
        subscription_plan:
          type: string
          enum:
          - FREE
          - PRIME_MONTHLY
          - PRIME_ANNUAL
          example: PRIME_ANNUAL
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
        updated_at:
          type: string
          format: date-time
        profiles:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/Profile'
        pin_enabled:
          type: boolean
          description: Code PIN activé pour achats/contenu adulte
        _links:
          $ref: '#/components/schemas/HATEOASLinks'
    UserCreate:
      type: object
      required:
      - email
      - username
      - password
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: ^[a-zA-Z0-9_]+$
        password:
          type: string
          minLength: 8
          description: Min 8 caractères, 1 majuscule, 1 chiffre
        subscription_plan:
          type: string
          enum:
          - FREE
          - PRIME_MONTHLY
          - PRIME_ANNUAL
          default: FREE
