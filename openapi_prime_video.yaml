openapi: 3.0.3
info:
  title: Amazon Prime Video API
  version: 1.0.0
  description: 'Spécification OpenAPI 3.0 exhaustive pour la plateforme Amazon Prime Video. Cette API couvre la gestion des
    utilisateurs, du catalogue média, des abonnements, de l''historique de lecture, des recommandations, ainsi que les fonctionnalités
    avancées telles que X-Ray, Dialogue Boost, le filtre Pur Prime et les résumés adaptatifs. Conçue selon les principes REST
    (stateless, cacheable, layered system, uniform interface) et l''approche API-First.

    '
  contact:
    name: Équipe API Prime Video
    email: api-primevideo@amazon.com
    url: https://developer.amazon.com/prime-video
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  termsOfService: https://www.amazon.com/prime-video/terms
servers:
- url: https://api.primevideo.amazon.com/v1
  description: Serveur de production
- url: https://staging-api.primevideo.amazon.com/v1
  description: Serveur de staging
- url: https://dev-api.primevideo.amazon.com/v1
  description: Serveur de développement
tags:
- name: Authentication
  description: Authentification et gestion des tokens JWT/OAuth2
- name: Users
  description: Gestion des utilisateurs et profils (jusqu'à 6 profils par compte)
- name: Media
  description: Catalogue média - films, séries, épisodes et métadonnées
- name: Subscriptions
  description: Gestion des abonnements Prime et chaînes tierces (Channels)
- name: Playback
  description: Lecture, streaming adaptatif et contrôles VCR
- name: History
  description: Historique de visionnage et progression
- name: Recommendations
  description: Recommandations personnalisées par algorithmes Big Data
- name: X-Ray
  description: Métadonnées en temps réel (acteurs, musiques, anecdotes via IMDb)
- name: LookAndBuy
  description: Intégration boutique Amazon - achat d'objets vus à l'écran
- name: DialogueBoost
  description: Amplification vocale par IA (3 niveaux)
- name: AdaptiveSummaries
  description: Résumés générés par IA basés sur l'historique du profil
- name: Watchlist
  description: Liste de lecture personnelle
- name: Downloads
  description: Téléchargement hors-ligne
- name: Reviews
  description: Avis et notes des utilisateurs sur les contenus
- name: Notifications
  description: Alertes et notifications utilisateur
- name: PaymentMethods
  description: Gestion des moyens de paiement
- name: Devices
  description: Gestion des appareils connectes
- name: SearchHistory
  description: Historique de recherche
- name: WatchParty
  description: Sessions de visionnage partage Watch Party 2.0
- name: Playlists
  description: Playlists partagees et personnelles
- name: Admin
  description: Administration - Analytics, moderation, gestion catalogue
security:
- BearerAuth: []
- OAuth2:
  - read
  - write
paths:
  /auth/token:
    post:
      tags:
      - Authentication
      summary: Obtenir un token d'accès JWT
      operationId: createToken
      description: 'Authentifie l''utilisateur et retourne un token JWT (RFC 7519) auto-contenu et stateless. Le token contient
        les claims : sub, roles, iat, exp. Conforme au principe stateless REST : chaque requête ultérieure inclura ce token
        via le header Authorization Bearer.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
            example:
              email: user@example.com
              password: SecurePass123!
      responses:
        '200':
          description: Authentification réussie - token JWT généré
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Nombre de requêtes autorisées par heure
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Nombre de requêtes restantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Rafraîchir un token JWT expiré
      operationId: refreshToken
      description: 'Génère un nouveau access_token à partir d''un refresh_token valide. Permet de maintenir la session sans
        re-authentification.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: Token de rafraîchissement
      responses:
        '200':
          description: Nouveau token généré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /users:
    get:
      tags:
      - Users
      summary: Récupérer la liste des utilisateurs
      operationId: getUsers
      description: 'Retourne une collection paginée d''utilisateurs. Supporte le filtrage, le tri et la pagination (query
        parameters). Méthode GET safe et idempotente. Réponse cacheable avec Cache-Control.

        '
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SortParam'
      - name: is_active
        in: query
        schema:
          type: boolean
        description: Filtrer par statut actif/inactif
      responses:
        '200':
          description: Liste paginée des utilisateurs récupérée avec succès
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=300
            X-Total-Count:
              schema:
                type: integer
              description: Nombre total d'utilisateurs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Users
      summary: Créer un nouvel utilisateur
      operationId: createUser
      description: 'Crée un nouveau compte utilisateur. POST n''est ni safe ni idempotent. Le serveur génère l''URI de la
        ressource (header Location). Le mot de passe est hashé côté serveur. Retourne 201 Created.

        '
      requestBody:
        required: true
        description: Données du nouvel utilisateur à créer
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            examples:
              basique:
                summary: Utilisateur basique
                value:
                  email: newuser@example.com
                  username: newuser123
                  password: SecurePass123!
              avec_profils:
                summary: Utilisateur avec profils jeunesse
                value:
                  email: famille@example.com
                  username: famille_dupont
                  password: FamillePass456!
                  subscription_plan: PRIME_ANNUAL
      responses:
        '201':
          description: Utilisateur créé avec succès
          headers:
            Location:
              schema:
                type: string
                example: /v1/users/12345
              description: URI de la ressource créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Conflit - email ou username déjà existant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation métier échouée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userId}:
    parameters:
    - name: userId
      in: path
      required: true
      description: Identifiant unique de l'utilisateur
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Users
      summary: Récupérer un utilisateur par ID
      operationId: getUserById
      description: 'Retourne la représentation JSON d''un utilisateur spécifique. GET est safe et idempotent. Supporte les
        requêtes conditionnelles (If-None-Match / ETag) pour optimiser le cache.

        '
      responses:
        '200':
          description: Utilisateur trouvé et retourné
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: private, max-age=600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '304':
          description: Ressource non modifiée (cache conditionnel)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
      - Users
      summary: Remplacer complètement un utilisateur
      operationId: updateUser
      description: 'Remplacement complet de la ressource utilisateur (PUT idempotent). Tous les champs doivent être fournis.
        Les champs omis seront réinitialisés.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Utilisateur mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - Users
      summary: Modifier partiellement un utilisateur
      operationId: patchUser
      description: 'Modification partielle (PATCH non idempotent). Seuls les champs fournis sont modifiés, les autres restent
        inchangés.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: Utilisateur partiellement mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Users
      summary: Supprimer un utilisateur
      operationId: deleteUser
      description: 'Suppression d''un utilisateur. DELETE est idempotent : plusieurs appels identiques produisent le même
        résultat.

        '
      responses:
        '204':
          description: Utilisateur supprimé avec succès (aucun contenu)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userId}/profiles:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Users
      summary: Lister les profils d'un utilisateur
      operationId: getUserProfiles
      description: 'Retourne les profils associés (max 6 dont profils Jeunesse). Sous-ressource REST : /users/{id}/profiles.

        '
      responses:
        '200':
          description: Liste des profils
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Users
      summary: Créer un nouveau profil
      operationId: createProfile
      description: Crée un profil (standard ou Jeunesse) pour l'utilisateur. Maximum 6 profils.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileCreate'
      responses:
        '201':
          description: Profil créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Limite de 6 profils atteinte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /media:
    get:
      tags:
      - Media
      summary: Rechercher et lister le catalogue média
      operationId: getMedia
      description: 'Retourne le catalogue média paginé avec filtrage avancé. Supporte le filtre Pur Prime (is_prime_inclusive)
        pour masquer le contenu transactionnel TVOD. Cacheable (public, max-age=3600).

        '
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SortParam'
      - name: type
        in: query
        schema:
          type: string
          enum:
          - movie
          - series
          - documentary
          - live_event
          - short
        description: Type de contenu
      - name: genre
        in: query
        schema:
          type: string
          enum:
          - action
          - comedy
          - drama
          - horror
          - sci_fi
          - thriller
          - romance
          - animation
          - documentary
        description: Genre du contenu
      - name: is_prime_inclusive
        in: query
        schema:
          type: boolean
          default: false
        description: 'Filtre Pur Prime - Si true, retourne uniquement le contenu inclus avec l''abonnement Prime (SVOD), masquant
          le contenu nécessitant un paiement supplémentaire (TVOD/Channels).

          '
      - name: min_rating
        in: query
        schema:
          type: number
          format: double
          minimum: 0
          maximum: 10
        description: Note IMDb minimale
      - name: release_year
        in: query
        schema:
          type: integer
          format: int32
        description: Année de sortie
      - name: language
        in: query
        schema:
          type: string
          example: fr
        description: Langue audio disponible (code ISO 639-1)
      - name: quality
        in: query
        schema:
          type: string
          enum:
          - SD
          - HD
          - FHD
          - UHD_4K
        description: Qualité vidéo minimale
      - name: has_audio_description
        in: query
        schema:
          type: boolean
        description: Filtrer les contenus avec audio description (AD)
      - name: q
        in: query
        schema:
          type: string
          minLength: 2
        description: Recherche textuelle par titre, acteur ou réalisateur
      responses:
        '200':
          description: Catalogue média paginé
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
            ETag:
              schema:
                type: string
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /media/{mediaId}:
    parameters:
    - name: mediaId
      in: path
      required: true
      description: Identifiant unique du contenu média
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Media
      summary: Récupérer les détails d'un contenu média
      operationId: getMediaById
      description: 'Retourne la fiche complète d''un film ou série avec métadonnées enrichies (titre, synopsis, acteurs, durée,
        badges qualité HDR/UHD/AD/5.1, disponibilité SVOD/TVOD, liens HATEOAS vers sous-ressources).

        '
      responses:
        '200':
          description: Détails du média
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: public, max-age=1800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '304':
          description: Non modifié (cache conditionnel ETag)
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /media/{mediaId}/seasons:
    parameters:
    - name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Media
      summary: Lister les saisons d'une série
      operationId: getSeasons
      description: Retourne les saisons d'une série. Applicable uniquement aux médias de type 'series'.
      responses:
        '200':
          description: Liste des saisons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Season'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /media/{mediaId}/seasons/{seasonNumber}/episodes:
    parameters:
    - name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: seasonNumber
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    get:
      tags:
      - Media
      summary: Lister les épisodes d'une saison
      operationId: getEpisodes
      description: Retourne les épisodes d'une saison donnée avec durée et progression.
      responses:
        '200':
          description: Liste des épisodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Episode'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /media/{mediaId}/xray:
    parameters:
    - name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - X-Ray
      summary: Récupérer les métadonnées X-Ray d'un contenu
      operationId: getXRayData
      description: 'Retourne les données X-Ray propulsées par IMDb : identification en temps réel des acteurs, musiques, personnages
        et anecdotes. Paramètre optionnel timestamp_sec pour cibler une scène précise.

        '
      parameters:
      - name: timestamp_sec
        in: query
        schema:
          type: integer
          minimum: 0
        description: Position en secondes pour les données contextuelles de scène
      responses:
        '200':
          description: Données X-Ray du contenu
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=86400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XRayData'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /media/{mediaId}/xray/scenes/{sceneId}/products:
    parameters:
    - name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: sceneId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - LookAndBuy
      summary: Obtenir les produits achetables d'une scène (Look & Buy)
      operationId: getLookAndBuyProducts
      description: 'Intégration X-Ray Interactive (Look & Buy) avec le magasin Amazon. Retourne les vêtements, accessoires
        et objets identifiés dans une scène spécifique, avec liens d''achat Amazon en un clic.

        '
      parameters:
      - name: category
        in: query
        schema:
          type: string
          enum:
          - clothing
          - accessories
          - furniture
          - electronics
          - all
        description: Catégorie de produit
      responses:
        '200':
          description: Produits achetables identifiés dans la scène
          content:
            application/json:
              schema:
                type: object
                properties:
                  scene_id:
                    type: string
                    format: uuid
                  timestamp_range:
                    $ref: '#/components/schemas/TimestampRange'
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/LookAndBuyProduct'
                  _links:
                    $ref: '#/components/schemas/HATEOASLinks'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /subscriptions:
    get:
      tags:
      - Subscriptions
      summary: Lister les plans d'abonnement disponibles
      operationId: getSubscriptionPlans
      description: 'Retourne tous les plans disponibles : Prime Monthly, Prime Annual, et les Chaînes tierces (Channels).
        Ressource publique cacheable.

        '
      security: []
      responses:
        '200':
          description: Liste des plans d'abonnement
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=86400
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionPlan'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userId}/subscriptions:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Subscriptions
      summary: Récupérer les abonnements actifs d'un utilisateur
      operationId: getUserSubscriptions
      description: Retourne les abonnements actifs (Prime + Channels).
      responses:
        '200':
          description: Abonnements de l'utilisateur
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Subscriptions
      summary: Souscrire à un abonnement
      operationId: createSubscription
      description: Active un nouvel abonnement Prime ou Channel pour l'utilisateur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
      responses:
        '201':
          description: Abonnement créé avec succès
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSubscription'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Abonnement déjà actif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userId}/subscriptions/{subscriptionId}:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    - name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      tags:
      - Subscriptions
      summary: Résilier un abonnement
      operationId: cancelSubscription
      description: Résilie un abonnement. L'accès reste actif jusqu'à la fin de la période payée.
      responses:
        '204':
          description: Abonnement résilié
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /playback/{mediaId}/stream:
    parameters:
    - name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Playback
      summary: Obtenir l'URL de streaming adaptatif
      operationId: getStreamUrl
      description: 'Retourne les URLs de streaming HLS/DASH avec DRM. Le client utilise l''ABR (Adaptive Bitrate) pour demander
        dynamiquement le segment dans la qualité la plus haute supportée par le réseau. Supporte le Dialogue Boost via header
        optionnel.

        '
      parameters:
      - name: quality
        in: query
        schema:
          type: string
          enum:
          - auto
          - SD
          - HD
          - FHD
          - UHD_4K
          default: auto
        description: Qualité souhaitée (auto = ABR adaptatif)
      - name: audio_language
        in: query
        schema:
          type: string
          example: fr
